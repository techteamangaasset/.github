name: build-dev (reusable)

on:
  workflow_call:
    inputs:
      ecr_repository:
        required: true
        type: string
      aws_role_arn:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: "Dockerfile.ecr-eks"
      aws_region:
        required: false
        type: string
        default: "sa-east-1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/${{ inputs.ecr_repository }}"
          docker build -f "${{ inputs.dockerfile }}" -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"